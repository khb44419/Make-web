name: 사진 받아오기
on:
  workflow_dispatch:
  push:
    paths:
      - photos-src.json
      - scripts/fetch_photos.py
      - .github/workflows/photos.yml
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_photos.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images photos.js preview || git add images photos.js
          git diff --cached --quiet || git commit -m "Update photos from Wikipedia"
          git push
