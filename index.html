<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2027 일본여행 대시보드</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎌 2027년 2월 일본여행</h1>
    <p id="dday"></p>
  </header>

  <nav class="city-buttons">
    <button data-city="osaka">🐙 오사카</button>
    <button data-city="nagoya">🏯 나고야</button>
  </nav>

  <main id="empty" class="hint">위에서 여행지를 골라보세요! ✈️</main>

  <main id="dashboard" hidden>
    <section class="intro">
      <h2 id="city-title"></h2>
      <p id="city-tagline"></p>
      <ul class="facts">
        <li>🌡️ <span id="weather"></span></li>
        <li>🚆 <span id="transport"></span></li>
      </ul>
      <p class="events"><b>2월 이벤트</b></p>
      <ul id="events"></ul>
    </section>

    <section>
      <h3>📅 3박 4일 추천 일정</h3>
      <div id="plan" class="plan"></div>
    </section>

    <section class="map-wrap">
      <div class="tabs">
        <button data-tab="all" class="active">전체</button>
        <button data-tab="sights">관광지</button>
        <button data-tab="foods">먹거리</button>
        <button data-tab="picks">⭐ 찜한 곳</button>
      </div>
      <div id="map"></div>
    </section>

    <section class="list">
      <h3>목록 <small>(⭐ 눌러서 우리 일정에 담기)</small></h3>
      <ul id="places"></ul>
    </section>
  </main>

  <main id="tools">
    <section>
      <h3>💰 예산 계산기 <small>(2명, 3박 4일 · 숫자는 마음대로 고쳐보세요)</small></h3>
      <div class="budget">
        <label>항공권 (1인) <input type="number" id="b-flight" step="10000"></label>
        <label>숙소 (1박, 방 1개) <input type="number" id="b-hotel" step="10000"></label>
        <label>식비 (1인/일) <input type="number" id="b-food" step="5000"></label>
        <label>교통 (1인/일) <input type="number" id="b-transport" step="1000"></label>
        <label>입장료·액티비티 (1인) <input type="number" id="b-act" step="10000"></label>
        <label>쇼핑 (총) <input type="number" id="b-shop" step="10000"></label>
      </div>
      <p class="total">총 <b id="b-total">0</b>원 · 1인 <b id="b-each">0</b>원</p>
    </section>
    <section>
      <h3>🎒 준비물 체크리스트</h3>
      <ul id="checklist" class="check"></ul>
    </section>
  </main>

  <footer>좌표는 대략적인 위치예요. 방문 전에 영업시간 · 예약 여부를 꼭 확인하세요.</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
